name: Screenshots

# The web page is compared with these pictures, and only a machine with Qt 6.7 or later can take them.
on:
  push:
    branches: [ccr-209c0806-o444sp]
    paths:
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

env:
  QT_VERSION: '6.10.3'

# The pictures are committed back to this branch, because a session that needs them may only reach
# github.com, not the storage that artifacts download from.
permissions:
  contents: write

jobs:
  shots:
    name: Take the screenshots (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # find_package(Qt6) does not read QT_ROOT_DIR, which install-qt-action sets.
      - name: Configure
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset default

      # An unbounded --parallel starts every compile at once and runs the runner out of memory.
      - name: Build the tests
        run: cmake --build --preset default --target desktop_tests --parallel 4

      - name: Take the screenshots
        run: WHIST_SHOTS_DIR="$GITHUB_WORKSPACE/shots" ./build/tests/desktop_tests "[.screenshot]"

      - name: Upload the screenshots
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots
          path: shots/*.png
          if-no-files-found: error

      # .gitignore keeps shots/ out of a commit, hence -f.
      - name: Commit the screenshots to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots/*.png
          git commit -m "Add the desktop's screenshots, taken on CI at ${GITHUB_SHA::7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

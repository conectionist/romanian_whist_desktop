name: CI (self-hosted)

# Temporary replacement for ci.yml while GitHub-hosted runner jobs are
# blocked by a failed account payment. Targets the self-hosted Windows
# runner. macOS and the release job are omitted intentionally: there is no
# self-hosted macOS runner, and release needs all three builds.
#
# build-linux is commented out below rather than removed: whist_wsl_ubuntu_runner
# is registered but not yet configured with the toolchain this project needs
# (CMake, Qt, patchelf, etc.), same as win_vm_runner was before it. Re-enable
# once that runner is prepped the same way.
#
# Once billing is resolved:
#   1. Re-enable ci.yml (restore its push/pull_request trigger block).
#   2. Delete or disable this file.

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

# See ci.yml for the full rationale behind this version pin.
env:
  QT_VERSION: '6.10.3'


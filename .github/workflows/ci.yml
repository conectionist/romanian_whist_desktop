name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Qt is not on any runner in a usable version - ubuntu-latest's apt Qt6 is 6.4,
# below the 6.7 floor in find_package(Qt6 6.7 REQUIRED ...) - so every build job
# installs the official Qt binary distribution first. That install is also where
# the shipped libraries come from: cmake --install runs the deploy script
# CMakeLists.txt generates with qt_generate_deploy_app_script(), and that script
# copies the needed Qt libraries and plugins out of the runner's Qt into the
# staging tree. Nothing Qt-shaped is vendored in this repository; this is the
# only place a Qt version is pinned.
#
# An exact version, not a wildcard, and 6.10.3 specifically. Both halves of that
# were learned from CI failures rather than chosen up front:
#
#   * It must be at least 6.9.2. macos-latest is macOS 26 (Tahoe), whose SDK
#     dropped the long-deprecated AGL framework that Qt had been linking for
#     Carbon-era OpenGL. Qt patched that in 6.8.4, 6.9.2 and 6.5.10 - but 6.8 is
#     an LTS whose later patch releases are commercial-only, so the newest
#     open-source 6.8 is 6.8.3, which can never carry the fix. Anything on the
#     6.8 series simply cannot link on macOS.
#
#   * It cannot be 6.11. Qt 6.11 is fetchable for Linux and macOS but not for
#     Windows: aqt fails there with "Failed to locate XML data for Qt version",
#     and aqtinstall 3.3.0 is the newest release, so there is no client-side fix
#     to upgrade to. 6.10.3 resolves on all three hosts.
#
# Pinned exactly because a floating '6.8.*' and then a '6.11.*' are what produced
# both failures - the version that gets installed should change when someone
# edits this line, not when upstream publishes.
#
# Note this trails the 6.11 used for local development. That is a deliberate
# consequence of the Windows availability gap above, not an oversight; revisit
# when 6.11 becomes fetchable for Windows.
env:
  QT_VERSION: '6.10.3'

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # qt_deploy_runtime_dependencies() rewrites RPATHs with patchelf so the
      # archived binary finds the Qt libraries shipped beside it rather than
      # whatever the host happens to have.
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      # QT_ROOT_DIR is exported by install-qt-action, but it does not set
      # CMAKE_PREFIX_PATH, and find_package(Qt6) does not read QT_ROOT_DIR.
      #
      # Passed as an environment variable rather than -DCMAKE_PREFIX_PATH=...
      # because CMake reads this one from the environment as a documented part of
      # the find_package search, and going through the environment keeps the value
      # away from shell and CMake command-line escaping. That matters on Windows,
      # where QT_ROOT_DIR is a backslash path; the three jobs use the same form so
      # they do not quietly diverge.
      #
      # Editors that lint workflows may flag env.QT_ROOT_DIR as "context access
      # might be invalid". It is a false positive: install-qt-action sets the
      # variable at runtime with core.exportVariable(), which a static linter
      # cannot see, and pointing CMAKE_PREFIX_PATH at ${QT_ROOT_DIR} is the usage
      # that action's own README prescribes. Do not "fix" it.
      - name: Configure
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset release

      # Also derives the artifact name and the install prefix, so the three jobs
      # differ in exactly one word - the platform - and the Windows path handling
      # below lives in one place instead of three.
      #
      # The prefix must be ABSOLUTE: qt6_deploy_qt_conf() rejects a relative one
      # outright ("Given qt.conf path is not an absolute path"), which is a
      # failure that only appears at the deploy step, long after configure and
      # build have gone green. GITHUB_WORKSPACE is a backslash path on Windows,
      # and CMake treats backslashes in an argument as escapes, so normalise the
      # separators here; on Linux and macOS the substitution is a no-op.
      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          name="romanian_whist_desktop-$version-linux"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prefix=${GITHUB_WORKSPACE//\\//}/staging/$name" >> "$GITHUB_OUTPUT"

      # --parallel needs a number. Without one, make gets a bare -j and starts
      # every compile at once. On ubuntu-26.04 that got the runner shut down
      # mid-build, most likely out of memory. 4 matches the hosted runners' cores.
      - name: Build
        run: cmake --build --preset release --parallel 4

      # --no-tests=error, because a build that lands with tests disabled would
      # otherwise print "No tests were found!!!" and exit 0 - green having run
      # nothing. The engine's CI learned this the hard way in Phase 0.
      - name: Test
        run: ctest --preset release --output-on-failure --no-tests=error

      - name: Deploy
        run: cmake --install build-release --config Release --prefix "${{ steps.version.outputs.prefix }}"

      # Two assertions, against two different silent failures.
      #
      # The libraries: on macOS qt_generate_deploy_app_script() is called with
      # NO_UNSUPPORTED_PLATFORM_ERROR, which by design turns an unsupported
      # platform into a no-op rather than a fatal error - the same shape of
      # failure CMakeLists.txt documents for .qrc files that embed nothing.
      #
      # The platform plugin: CMakeLists.txt deploys a deliberately minimal plugin
      # set, and Qt offers only a denylist to express that. Nothing but this check
      # would notice if the platform plugin stopped being deployed - the build
      # stays green, the archive looks reasonable, and the application aborts on
      # the user's machine with "no Qt platform plugin could be initialized".
      - name: Verify the deploy
        run: |
          if [ -z "$(find staging -name 'libQt6Widgets*' -print -quit)" ]; then
            echo "::error::No Qt libraries in the staging tree - the deploy script did nothing."
            find staging
            exit 1
          fi
          if [ -z "$(find staging -name 'libqxcb.so' -print -quit)" ]; then
            echo "::error::No platform plugin in the staging tree - the app cannot start."
            find staging
            exit 1
          fi

      # cmake -E tar rather than the platform's own tar/zip: it is guaranteed
      # present (we already require cmake), behaves identically on all three
      # runners, and preserves the symlinks and executable bits that
      # upload-artifact drops when it re-zips a directory. That is also why the
      # archive is built here instead of uploading the staging directory.
      - name: Archive
        working-directory: staging
        run: cmake -E tar czf "../${{ steps.version.outputs.name }}.tar.gz" "${{ steps.version.outputs.name }}"

      # archive: false uploads the tarball as-is. Without it upload-artifact wraps
      # everything in a zip of its own, so downloading from the Actions page gives
      # a zip containing a tar.gz - two archives to get at one tree. The tarball
      # itself still has to exist, because that zip does not preserve the
      # executable bit ("all files will have 644") and would flatten lib/'s
      # symlinks into duplicate copies. Release assets were never double-wrapped;
      # this only fixes the run-page download.
      #
      # The file name becomes the artifact name when archive is false - the name
      # input is ignored - which is why it still matches the release job's pattern.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.name }}.tar.gz
          archive: false

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # See the note on this step in build-linux.
      - name: Configure
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset release

      # See the note on this step in build-linux. This is the job the separator
      # normalisation exists for.
      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          name="romanian_whist_desktop-$version-windows"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prefix=${GITHUB_WORKSPACE//\\//}/staging/$name" >> "$GITHUB_OUTPUT"

      # The default generator here is multi-config Visual Studio, which ignores
      # CMAKE_BUILD_TYPE. The build preset's "configuration": "Release" is what
      # actually selects Release, and --config Release below matches it.
      - name: Build
        run: cmake --build --preset release --parallel 4

      - name: Test
        run: ctest --preset release --output-on-failure --no-tests=error

      - name: Deploy
        shell: bash
        run: cmake --install build-release --config Release --prefix "${{ steps.version.outputs.prefix }}"

      - name: Verify the deploy
        shell: bash
        run: |
          if [ -z "$(find staging -name 'Qt6Widgets.dll' -print -quit)" ]; then
            echo "::error::No Qt libraries in the staging tree - windeployqt did nothing."
            find staging
            exit 1
          fi
          if [ -z "$(find staging -name 'qwindows.dll' -print -quit)" ]; then
            echo "::error::No platform plugin in the staging tree - the app cannot start."
            find staging
            exit 1
          fi
          # The Visual C++ runtime the executable and Qt import - see the note
          # on InstallRequiredSystemLibraries in CMakeLists.txt.
          for dll in msvcp140.dll msvcp140_1.dll msvcp140_2.dll vcruntime140.dll vcruntime140_1.dll; do
            if [ -z "$(find staging -iname "$dll" -print -quit)" ]; then
              echo "::error::No $dll in the staging tree - the app cannot start on a PC without the Visual C++ runtime."
              find staging
              exit 1
            fi
          done

      - name: Archive
        shell: bash
        working-directory: staging
        run: cmake -E tar cf "../${{ steps.version.outputs.name }}.zip" --format=zip "${{ steps.version.outputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.name }}.zip
          archive: false   # see the note in build-linux

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: cmake --preset release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      # See the note on this step in build-linux.
      - name: Get project version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^CMAKE_PROJECT_VERSION:' build-release/CMakeCache.txt | cut -d= -f2)
          name="romanian_whist_desktop-$version-macos"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prefix=${GITHUB_WORKSPACE//\\//}/staging/$name" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build --preset release --parallel 4

      - name: Test
        run: ctest --preset release --output-on-failure --no-tests=error

      # qt_add_executable(... MACOSX_BUNDLE) plus BUNDLE DESTINATION . in
      # CMakeLists.txt puts romanian_whist_desktop.app at the prefix root, and
      # macdeployqt fills its Frameworks directory.
      - name: Deploy
        run: cmake --install build-release --config Release --prefix "${{ steps.version.outputs.prefix }}"

      # This assertion carries more weight than its Linux and Windows siblings:
      # it is the only automated check on an artifact no maintainer here can open.
      - name: Verify the deploy
        run: |
          if [ -z "$(find staging -name 'QtWidgets.framework' -print -quit)" ]; then
            echo "::error::No Qt frameworks inside the .app - macdeployqt did nothing."
            find staging -maxdepth 6
            exit 1
          fi
          if [ -z "$(find staging -name 'libqcocoa.dylib' -print -quit)" ]; then
            echo "::error::No platform plugin inside the .app - the app cannot start."
            find staging -maxdepth 6
            exit 1
          fi

      # tar, not zip: a deployed .app is full of framework symlinks and needs its
      # executable bits, and tar preserves both without any extra flags.
      - name: Archive
        working-directory: staging
        run: cmake -E tar czf "../${{ steps.version.outputs.name }}.tar.gz" "${{ steps.version.outputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.name }}.tar.gz
          archive: false   # see the note in build-linux

  release:
    needs: [build-linux, build-windows, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The regex wants three components, so cmake_minimum_required(VERSION 3.21)
      # on line 1 does not match and project(... VERSION x.y.z) is the first hit.
      - name: Determine version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      # skip-decompress because the build jobs upload with archive: false, so
      # these artifacts are the .tar.gz and .zip files themselves rather than
      # zips wrapping them. Without it the download step would unpack them and
      # leave directories, and the release below attaches files.
      - name: Download artifacts
        if: steps.version.outputs.is_new == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: romanian_whist_desktop-*
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      # This job only ever runs on master, so it cannot be rehearsed on a branch
      # the way the build jobs were. Listing what will be attached makes the
      # first real run self-explanatory if the artifacts arrive in an unexpected
      # shape, rather than failing inside the release action.
      - name: Show what will be released
        if: steps.version.outputs.is_new == 'true'
        run: ls -l artifacts/

      - name: Create release
        if: steps.version.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/*
